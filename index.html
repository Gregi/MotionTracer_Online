<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15-Sekunden Live-Messung</title>
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --success-color: #22c55e;
      --danger-color: #ef4444;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 8px;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select, button {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #475569;
      background-color: #334155;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button.connect {
      background-color: #475569;
      color: white;
    }

    button.start {
      background-color: var(--success-color);
      color: #0f172a;
      font-weight: bold;
      border: none;
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      background-color: #475569;
    }

    .status-badge.connected {
      background-color: var(--accent-color);
      color: #0f172a;
    }

    .status-badge.recording {
      background-color: var(--success-color);
      color: #0f172a;
    }

    .chart-box {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      position: relative;
      height: 450px;
    }

    .console-box {
      margin-top: 20px;
      background: #020617;
      border-radius: 8px;
      padding: 10px 15px;
      font-family: monospace;
      font-size: 13px;
      height: 100px;
      overflow-y: auto;
      color: #a7f3d0;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h2 style="margin:0;">15-Sekunden Messung</h2>
      <span id="status" class="status-badge">Getrennt</span>
    </div>

    <div class="controls">
      <select id="baudRate">
        <option value="9600">9600 Baud</option>
        <option value="115200" selected>115200 Baud</option>
      </select>

      <button id="btnConnect" class="connect" onclick="toggleConnect()">Port öffnen</button>
      <button id="btnStart" class="start" onclick="startMeasurement()" disabled>Messung starten</button>
    </div>
  </header>

  <div class="chart-box">
    <canvas id="liveChart"></canvas>
  </div>

  <div id="console" class="console-box">Bitte zuerst den Port verbinden...</div>
</div>

<script>
  let port;
  let reader;
  let keepReading = false;
  let chart;

  // Messungs-Status
  let isRecording = false;
  let startTime = 0;
  const MAX_DURATION_SEC = 15;

  // 1. Chart.js Initialisierung mit festen Achsen
  function initChart() {
    const ctx = document.getElementById('liveChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        datasets: [
          {
            label: 'Messwert 1',
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.2)',
            data: [],
            borderWidth: 2,
            tension: 0.2,
            pointRadius: 2
          },
          {
            label: 'Messwert 2',
            borderColor: '#f43f5e',
            backgroundColor: 'rgba(244, 63, 94, 0.2)',
            data: [],
            borderWidth: 2,
            tension: 0.2,
            pointRadius: 2
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false, // Für flüssige Echtzeit-Performance ausschalten
        scales: {
          x: {
            type: 'linear',
            min: 0,
            max: MAX_DURATION_SEC,
            title: {
              display: true,
              text: 'Zeit (Sekunden)',
              color: '#94a3b8'
            },
            grid: { color: '#334155' },
            ticks: { color: '#94a3b8', stepSize: 1 }
          },
          y: {
            min: 0,
            max: 45,
            title: {
              display: true,
              text: 'Messwerte (0 - 45)',
              color: '#94a3b8'
            },
            grid: { color: '#334155' },
            ticks: { color: '#94a3b8' }
          }
        },
        plugins: {
          legend: { labels: { color: '#f8fafc' } }
        }
      }
    });
  }

  // 2. Messung triggern (Reset & Start)
  function startMeasurement() {
    if (!port) return;

    // Chart zurücksetzen
    chart.data.datasets[0].data = [];
    chart.data.datasets[1].data = [];
    chart.update();

    startTime = Date.now();
    isRecording = true;

    document.getElementById('btnStart').disabled = true;
    updateStatus('recording', 'Messung läuft (0-15s)...');
    logConsole("--- Neue Messung gestartet ---");
  }

  function stopMeasurement() {
    isRecording = false;
    document.getElementById('btnStart').disabled = false;
    updateStatus('connected', 'Bereit für neue Messung');
    logConsole("--- 15 Sekunden abgelaufen. Messung beendet. ---");
  }

  // 3. Serieller Datenstrom lesen
  async function connectSerial() {
    if (!('serial' in navigator)) {
      alert('Die Web Serial API wird von diesem Browser nicht unterstützt.');
      return;
    }

    try {
      port = await navigator.serial.requestPort();
      const baudRate = parseInt(document.getElementById('baudRate').value);
      await port.open({ baudRate });

      updateStatus('connected', 'Verbunden');
      document.getElementById('btnConnect').textContent = 'Port schließen';
      document.getElementById('btnStart').disabled = false;
      logConsole(`Port mit ${baudRate} Baud geöffnet.`);

      keepReading = true;
      readSerialData();

    } catch (err) {
      logConsole(`Fehler beim Öffnen: ${err.message}`);
      await disconnectSerial();
    }
  }

  async function readSerialData() {
    const textDecoder = new TextDecoderStream();
    const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
    const lineReader = textDecoder.readable.getReader();
    reader = lineReader;

    let buffer = '';

    try {
      while (keepReading) {
        const { value, done } = await lineReader.read();
        if (done) break;

        buffer += value;
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          const trimmed = line.trim();
          if (trimmed.length > 0 && isRecording) {
            processDataLine(trimmed);
          }
        }
      }
    } catch (error) {
      logConsole(`Verbindungsabbruch: ${error.message}`);
    } finally {
      lineReader.releaseLock();
      await disconnectSerial();
    }
  }

  // 4. Zeile verarbeiten (Format: Zeit, Wert1, Wert2)
  function processDataLine(line) {
    // Erwartet: "Zeit, Wert1, Wert2"
    const parts = line.split(',').map(v => parseFloat(v.trim()));

    if (parts.length >= 3 && !isNaN(parts[1]) && !isNaN(parts[2])) {
      
      // Relative Zeit im Browser seit Klick auf "Messung starten"
      const elapsedSec = (Date.now() - startTime) / 1000;

      // Wenn die 15 Sekunden überschritten sind -> Messung stoppen
      if (elapsedSec > MAX_DURATION_SEC) {
        stopMeasurement();
        return;
      }

      const val1 = parts[1];
      const val2 = parts[2];

      logConsole(`t=${elapsedSec.toFixed(2)}s | W1: ${val1} | W2: ${val2}`);

      // Punkte hinzufügen (x = Zeit in Sek, y = Wert)
      chart.data.datasets[0].data.push({ x: elapsedSec, y: val1 });
      chart.data.datasets[1].data.push({ x: elapsedSec, y: val2 });

      chart.update('none'); // Schnelles Rendering ohne Animation
    }
  }

  // 5. Port-Handling
  async function toggleConnect() {
    if (port) {
      await disconnectSerial();
    } else {
      await connectSerial();
    }
  }

  async function disconnectSerial() {
    isRecording = false;
    keepReading = false;

    if (reader) {
      try { await reader.cancel(); } catch (e) {}
      reader = null;
    }

    if (port) {
      try { await port.close(); } catch (e) {}
      port = null;
    }

    document.getElementById('btnConnect').textContent = 'Port öffnen';
    document.getElementById('btnStart').disabled = true;
    updateStatus('disconnected', 'Getrennt');
    logConsole("Port geschlossen.");
  }

  function updateStatus(state, text) {
    const badge = document.getElementById('status');
    badge.textContent = text;
    badge.className = 'status-badge';
    if (state === 'connected') badge.classList.add('connected');
    if (state === 'recording') badge.classList.add('recording');
  }

  function logConsole(msg) {
    const consoleElem = document.getElementById('console');
    consoleElem.innerHTML += `${msg}<br>`;
    consoleElem.scrollTop = consoleElem.scrollHeight;
  }

  window.onload = initChart;
</script>

</body>
</html>
